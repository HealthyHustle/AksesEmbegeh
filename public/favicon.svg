<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mbg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0F2747"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#mbg-grad)"/>
  
  <!-- Bridge Arch -->
  <path d="M12 46 C20 28, 44 28, 52 46" stroke="url(#glow-grad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Vertical Bridge Struts / Neural Pathways -->
  <line x1="22" y1="36" x2="22" y2="46" stroke="#CFEAFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="32" y1="31" x2="32" y2="46" stroke="#CFEAFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="42" y1="36" x2="42" y2="46" stroke="#CFEAFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  
  <!-- Brain / Knowledge Nodes -->
  <circle cx="32" cy="20" r="5" fill="#FFFFFF"/>
  <circle cx="32" cy="20" r="8" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="20" cy="26" r="3.5" fill="#CFEAFF"/>
  <circle cx="44" cy="26" r="3.5" fill="#CFEAFF"/>
  
  <!-- Connection Lines -->
  <line x1="20" y1="26" x2="32" y2="20" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="44" y1="26" x2="32" y2="20" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>